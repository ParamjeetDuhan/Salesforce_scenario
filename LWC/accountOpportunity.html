<template>
    <lightning-card title="Open opportunities" icon-name="standard:opportunity">
        <div class="slds-var-p-around_medium">

            <lightning-combobox
                label="Filter by stage"
                value={selectedStage}
                options={stageOptions}
                onchange={handleStageChange}>
            </lightning-combobox>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template lwc:elseif={error}>
                <p class="slds-text-color_error slds-var-m-top_medium">{errorMessage}</p>
            </template>
            <template lwc:elseif={opportunities.length}>
                <p class="slds-var-m-vertical_small">
                    Total amount:
                    <lightning-formatted-number
                        value={totalAmount}
                        format-style="currency"
                        currency-code={currencyCode}>
                    </lightning-formatted-number>
                </p>
                <lightning-datatable
                    key-field="Id"
                    data={opportunities}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak slds-var-m-top_medium">No open opportunities</p>
            </template>

        </div>
    </lightning-card>
</template>
